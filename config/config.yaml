# Configuration centrale du projet (validée par gold_agents.config).
# Les seuils sont réglés sur la validation puis FIGÉS avant le test,
# et inscrits dans le bloc genèse du registre (§6.3).

seed: 42

data:
  raw_path: data/raw/XAU_1d_data.csv          # Kaggle, figé (SHA-256 dans CHECKSUMS.txt)
  update_path: data/raw/XAU_1d_update.csv    # jours ajoutés par l'API (make update-data)
  gapfill_path: data/raw/XAU_1d_gapfill.csv  # trous du CSV Kaggle comblés (make fill-gaps)
  checksums_path: data/raw/CHECKSUMS.txt
  processed_dir: data/processed

splits:
  train_end: "2018-12-31"
  val_start: "2019-01-01"
  val_end: "2021-12-31"
  test_start: "2022-01-01"

features:
  window: 30            # W, à régler : 20, 30, 60
  sma_periods: [10, 20, 50]
  ema_periods: [10, 20, 50]
  rsi_period: 14
  atr_period: 14
  volatility_window: 20
  return_lags: [1, 5, 10, 20]   # rendements des k derniers jours

strategy:
  buy_rule: quantile  # tune --apply, 2026-11-01
  # Tentative 1 : réglage FIGÉ le 2026-10-30 (gold-agents tune, walk-forward 2011-2021),
  # seuil d'achat absolu. Au test, l'ensemble n'a jamais prévu plus de 0,09 % : zéro trade.
  # Tentative 2 : seuil relatif (quantile des prévisions passées). `tune --apply` écrit
  # ici le nouveau réglage, puis `freeze --again` le scelle avant de relancer le test.
  quantile_window: 250  # règle relative : prévisions des 250 jours précédents (~1 an)
  quantile_min_days: 60 # pas d'achat tant qu'il y a moins de 60 prévisions passées
  theta_buy: 0.7  # tune --apply, 2026-11-01
  theta_sell: 0.0       # vendre dès que r̂ < 0
  min_confidence: null  # tune --apply, 2026-11-01
  model: ensemble       # agent de prévision : ensemble LSTM + GRU

risk:
  max_position: 1.0     # fraction du capital (1.0 = 100 %)
  stop_loss: 0.03  # tune --apply, 2026-11-01
  max_drawdown: 0.25    # -25 % -> passage en cash (réglé en phase 6)
  allow_short: false
  cooldown_days: 20     # reprise après 20 jours en cash (null : en cash jusqu'à la fin)

simulation:
  initial_capital: 10000.0
  fee_rate: 0.001       # 0,1 %
  slippage: 0.0002      # 0,02 %
  risk_free_rate: 0.0   # taux sans risque annuel du Sharpe (0 = Sharpe « brut »)

models:
  seeds: [0, 1, 2, 3, 4]  # chaque modèle final est entraîné 5 fois (moyenne ± écart-type)
  max_epochs: 100
  patience: 15          # early stopping : arrêt après 15 époques sans progrès en validation
  optuna_trials: 20     # essais Optuna par réseau (LSTM, GRU)
  lgbm_trials: 30       # essais Optuna pour LightGBM
  mc_samples: 50        # passages MC Dropout pour l'incertitude
  direction_alert: 0.60 # précision directionnelle au-delà : fuite de données probable
  mlflow_uri: sqlite:///mlruns/mlflow.db
  threads: 0            # threads PyTorch (0 = automatique)

tuning:
  # Phase 6 : walk-forward à fenêtre croissante. Chaque période est prédite par des
  # modèles réentraînés sur tout ce qui la précède (depuis 2004), puis jugée.
  # La dernière période est la validation. Le test (2022+) n'est jamais lu.
  folds:
    - ["2011-01-01", "2012-12-31"]
    - ["2013-01-01", "2014-12-31"]
    - ["2015-01-01", "2016-12-31"]
    - ["2017-01-01", "2018-12-31"]
    - ["2019-01-01", "2021-12-31"]
  early_stop_days: 250  # la dernière année du passé sert à l'arrêt anticipé
  seeds: [0, 1, 2]      # graines par réseau et par période
  # Tentative 2 : θ_buy relatif. Acheter si r̂ dépasse le quantile θ_buy des prévisions
  # passées du même modèle : ne dépend plus de l'échelle des prévisions.
  buy_rule: quantile
  min_trades_per_year: 4   # « ni 0, ni des milliers » : au moins 4 trades par an...
  max_trades_per_year: 60  # ... et au plus 60, dans chaque période
  grid:                 # grille grossière (R4), pas d'Optuna
    theta_buy: [0.5, 0.7, 0.8, 0.9]   # quantiles : médiane, 70e, 80e, 90e centile
    theta_sell: [0.0, 0.0002, 0.0005, 0.001]
    min_confidence: [null, 0.25, 0.5, 1.0]      # null : sans filtre MC Dropout
    stop_loss: [0.03, 0.05, 0.08]
    max_drawdown: [0.15, 0.20, 0.25]
    models: [ensemble]  # tentative 2 : le système principal annoncé (ensemble + MC)
  costs_factors: [0, 1, 2, 5]
  random_runs: 200      # stratégies aléatoires (même nombre de trades) par période

live:
  # Simulation en direct (paper trading), après le test. La règle de décision est celle
  # de `strategy` et `risk` ci-dessus, scellée par `freeze` : live-init refuse de démarrer
  # si elle diffère du dernier gel. Ici : seulement l'entraînement des modèles figés.
  seeds: [0, 1, 2]      # graines par réseau (comme le walk-forward)
  early_stop_days: 250  # la dernière année du passé sert à l'arrêt anticipé
  mc_seed: 0            # graine du MC Dropout (σ̂ reproductible)
