# Configuration centrale du projet (validée par gold_agents.config).
# Les seuils sont réglés sur la validation puis FIGÉS avant le test,
# et inscrits dans le bloc genèse du registre (§6.3).

seed: 42

data:
  raw_path: data/raw/XAU_1d_data.csv          # Kaggle, figé (SHA-256 dans CHECKSUMS.txt)
  update_path: data/raw/XAU_1d_update.csv    # jours ajoutés par l'API (make update-data)
  gapfill_path: data/raw/XAU_1d_gapfill.csv  # trous du CSV Kaggle comblés (make fill-gaps)
  checksums_path: data/raw/CHECKSUMS.txt
  processed_dir: data/processed

splits:
  train_end: "2018-12-31"
  val_start: "2019-01-01"
  val_end: "2021-12-31"
  test_start: "2022-01-01"

features:
  window: 30            # W, à régler : 20, 30, 60
  sma_periods: [10, 20, 50]
  ema_periods: [10, 20, 50]
  rsi_period: 14
  atr_period: 14
  volatility_window: 20
  return_lags: [1, 5, 10, 20]   # rendements des k derniers jours

strategy:
  # Phase 5 : signe de la prévision (seuils nuls). À régler sur la validation en phase 6.
  theta_buy: 0.0
  theta_sell: 0.0
  min_confidence: 0.5   # k du filtre MC Dropout : acheter seulement si r̂/σ̂ > k (P(hausse) > 69 %)

risk:
  max_position: 1.0     # fraction du capital (1.0 = 100 %)
  stop_loss: 0.05       # -5 % sur la position
  max_drawdown: 0.20    # -20 % -> passage en cash
  allow_short: false

simulation:
  initial_capital: 10000.0
  fee_rate: 0.001       # 0,1 %
  slippage: 0.0002      # 0,02 %
  risk_free_rate: 0.0   # taux sans risque annuel du Sharpe (0 = Sharpe « brut »)

models:
  seeds: [0, 1, 2, 3, 4]  # chaque modèle final est entraîné 5 fois (moyenne ± écart-type)
  max_epochs: 100
  patience: 15          # early stopping : arrêt après 15 époques sans progrès en validation
  optuna_trials: 20     # essais Optuna par réseau (LSTM, GRU)
  lgbm_trials: 30       # essais Optuna pour LightGBM
  mc_samples: 50        # passages MC Dropout pour l'incertitude
  direction_alert: 0.60 # précision directionnelle au-delà : fuite de données probable
  mlflow_uri: sqlite:///mlruns/mlflow.db
  threads: 0            # threads PyTorch (0 = automatique)
