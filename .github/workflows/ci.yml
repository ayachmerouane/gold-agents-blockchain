name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Installer Python 3.11 et les dépendances
        run: |
          uv python install 3.11
          uv sync --extra dev --extra eda

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typage (mypy)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest -m "not slow" --cov --cov-report=term-missing
