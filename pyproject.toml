[project]
name = "gold-agents"
version = "0.1.0"
description = "Investissement simulé sur l'or (XAU/USD) : Deep Learning, agents autonomes et blockchain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "cryptography>=42",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "mlflow>=2.12",
]
eda = [
    "matplotlib>=3.8",
    "statsmodels>=0.14",
]
fetch = [
    "yfinance>=0.2.48",
]
anchor = [
    "web3>=7",
]
dashboard = [
    "streamlit>=1.50",
    "plotly>=5.20",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "pandas-stubs>=2.2",
]

[project.scripts]
gold-agents = "gold_agents.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gold_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests longs (backtests complets), exclus de la CI rapide",
]

[tool.coverage.run]
source = ["gold_agents"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["gold_agents"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["statsmodels.*", "scipy.*", "sklearn.*", "lightgbm.*", "optuna.*", "mlflow.*", "web3.*"]
ignore_missing_imports = true
